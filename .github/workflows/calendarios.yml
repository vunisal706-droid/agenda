name: Calendarios del cole (Google Calendar)

on:
  schedule:
    - cron: '0 4 * * *'     # cada día, por si cambian los órdenes del día o los trámites
  workflow_dispatch:
  push:
    paths:
      - 'calendario.json'
      - 'reuniones.json'
      - 'scripts/ics.py'
      - '.github/workflows/calendarios.yml'

permissions:
  contents: write

jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ics.py
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add calendario-profesorado.ics calendario-familias.ics
          # solo se guarda si cambia algo más que la marca de tiempo
          if git diff --cached -I '^DTSTAMP' --quiet; then git reset -q; echo "Sin cambios"; else git commit -m "Calendarios del cole actualizados" && git pull --rebase && git push; fi
